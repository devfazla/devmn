name: Deploy to GitHub Pages

# Builds the Vite React app in react-app/ and publishes react-app/dist/ to
# GitHub Pages. The custom domain (devfazla.com) and the SPA 404 fallback are
# carried by react-app/public/CNAME and react-app/public/404.html, which Vite
# copies into dist/ on every build.

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN is only used to publish the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
